<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarefaPix - Painel Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f5f5; color: #333; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .login-box { background: white; border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 28px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .admin-container { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #667eea; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #718096; font-size: 14px; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #2d3748; }
        .section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section h2 { margin-bottom: 20px; color: #2d3748; display: flex; align-items: center; gap: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #667eea; color: white; }
        .item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .item-title { font-weight: bold; color: #2d3748; }
        .item-meta { color: #718096; font-size: 14px; }
        .item img { width: 100%; max-width: 300px; border-radius: 8px; margin: 10px 0; cursor: pointer; }
        .user-badge { background: #667eea; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; font-family: monospace; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #fffaf0; color: #c05621; }
        .badge-approved { background: #f0fff4; color: #22543d; }
        .badge-rejected { background: #fff5f5; color: #c53030; }
        .actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn-approve { padding: 10px 20px; background: #48bb78; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-reject { padding: 10px 20px; background: #e53e3e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-delete { padding: 10px 20px; background: #718096; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .btn-save { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .empty { text-align: center; padding: 40px; color: #718096; }
        .filter-bar { background: #f7fafc; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2d3748; color: white; padding: 16px 24px; border-radius: 12px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 300; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="logo"><h1>🔐 Painel Admin</h1></div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Senha de Administrador</label>
                    <input type="password" id="adminPass" placeholder="Digite a senha" required>
                </div>
                <button type="submit" class="btn-primary">ENTRAR</button>
            </form>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <div class="header">
            <h1>📊 TarefaPix Admin</h1>
            <button class="btn-delete" onclick="logout()">Sair</button>
        </div>

        <div class="stats">
            <div class="stat-card"><h3>👥 Usuários Únicos</h3><div class="value" id="statUsers">0</div></div>
            <div class="stat-card"><h3>📋 Comprovantes Pendentes</h3><div class="value" id="statPending">0</div></div>
            <div class="stat-card"><h3>✓ Comprovantes Aprovados</h3><div class="value" id="statApproved">0</div></div>
            <div class="stat-card"><h3>💸 Saques Pendentes</h3><div class="value" id="statWithdrawals">0</div></div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showSection('submissions')">📋 Comprovantes</button>
            <button class="tab" onclick="showSection('withdrawals')">💸 Saques</button>
            <button class="tab" onclick="showSection('tasks')">📝 Tarefas</button>
            <button class="tab" onclick="showSection('users')">👥 Usuários</button>
        </div>

        <div class="section" id="section-submissions">
            <h2>📋 Comprovantes Enviados</h2>
            <div class="filter-bar">
                <label>Filtrar por ID:</label>
                <input type="text" id="filterUserId" placeholder="Ex: USER_123456" onkeyup="renderSubmissions()">
                <label>Status:</label>
                <select id="filterStatus" onchange="renderSubmissions()">
                    <option value="all">Todos</option>
                    <option value="pending">Pendentes</option>
                    <option value="approved">Aprovados</option>
                    <option value="rejected">Rejeitados</option>
                </select>
            </div>
            <div id="submissionsList"></div>
        </div>

        <div class="section" id="section-withdrawals" style="display:none;">
            <h2>💸 Solicitações de Saque</h2>
            <div class="filter-bar">
                <label>Filtrar por ID:</label>
                <input type="text" id="filterWithdrawUserId" placeholder="Ex: USER_123456" onkeyup="renderWithdrawals()">
            </div>
            <div id="withdrawalsList"></div>
        </div>

        <div class="section" id="section-tasks" style="display:none;">
            <h2>📝 Gerenciar Tarefas</h2>
            <div style="background:#f7fafc;padding:20px;border-radius:12px;margin-bottom:20px;">
                <h3 style="margin-bottom:15px;">➕ Nova Tarefa</h3>
                <div class="form-group"><label>Título</label><input type="text" id="newTaskTitle" placeholder="Ex: Recarregue R$ 5,00 e Ganhe R$ 6,00"></div>
                <div class="form-group"><label>Descrição</label><textarea id="newTaskDesc" placeholder="Descrição detalhada da tarefa..."></textarea></div>
                <div class="form-group"><label>Link</label><input type="url" id="newTaskLink" placeholder="https://..."></div>
                <div class="form-group"><label>🖼️ Foto Tutorial (Upload)</label><input type="file" id="newTaskTutImg" accept="image/*"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
                    <div class="form-group"><label>Recompensa (R$)</label><input type="number" id="newTaskReward" step="0.01" value="6"></div>
                    <div class="form-group"><label>Moedas</label><input type="number" id="newTaskCoins" value="6000"></div>
                </div>
                <button class="btn-save" onclick="createTask()">Criar Tarefa</button>
            </div>
            <div id="tasksList"></div>
        </div>
        
        <div class="section" id="section-users" style="display:none;">
            <h2>👥 Usuários Cadastrados</h2>
            <div class="filter-bar">
                <label>Buscar ID:</label>
                <input type="text" id="searchUserId" placeholder="Ex: USER_123456" onkeyup="renderUsers()">
            </div>
            <div id="usersList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const DB_PREFIX = 'tarefapix_';
        const ADMIN_PASSWORD = 'admin123';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadData();
            } else showToast('❌ Senha incorreta!');
        });

        function logout() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminContainer').style.display = 'none';
            document.getElementById('adminPass').value = '';
        }

        function showSection(section) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            ['submissions', 'withdrawals', 'tasks', 'users'].forEach(s => document.getElementById('section-' + s).style.display = 'none');
            document.getElementById('section-' + section).style.display = 'block';
            if (section === 'submissions') renderSubmissions();
            if (section === 'withdrawals') renderWithdrawals();
            if (section === 'tasks') renderTasks();
            if (section === 'users') renderUsers();
        }

        function loadData() { updateStats(); renderSubmissions(); }

        function updateStats() {
            const submissions = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            const withdrawals = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            const users = new Set(submissions.map(s => s.user).filter(u => u));
            document.getElementById('statUsers').textContent = users.size;
            document.getElementById('statPending').textContent = submissions.filter(s => s.status === 'pending').length;
            document.getElementById('statApproved').textContent = submissions.filter(s => s.status === 'approved').length;
            document.getElementById('statWithdrawals').textContent = withdrawals.filter(w => w.status === 'pending').length;
        }

        function renderSubmissions() {
            const list = document.getElementById('submissionsList');
            let submissions = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            const filterId = document.getElementById('filterUserId').value.toUpperCase();
            const filterStatus = document.getElementById('filterStatus').value;
            if (filterId) submissions = submissions.filter(s => s.user && s.user.includes(filterId));
            if (filterStatus !== 'all') submissions = submissions.filter(s => s.status === filterStatus);
            
            if (submissions.length === 0) { list.innerHTML = '<div class="empty">Nenhum comprovante encontrado</div>'; return; }
            
            submissions.sort((a, b) => { if (a.status === 'pending' && b.status !== 'pending') return -1; if (a.status !== 'pending' && b.status === 'pending') return 1; return new Date(b.date) - new Date(a.date); });
            
            list.innerHTML = submissions.map(sub => {
                let badge = '<span class="badge badge-pending">⏳ Pendente</span>', actions = '<div class="actions"><button class="btn-approve" onclick="approveSubmission(' + sub.id + ')">✓ Aprovar</button><button class="btn-reject" onclick="rejectSubmission(' + sub.id + ')">✕ Rejeitar</button></div>';
                if (sub.status === 'approved') { badge = '<span class="badge badge-approved">✓ Aprovado</span>'; actions = ''; }
                else if (sub.status === 'rejected') { badge = '<span class="badge badge-rejected">✕ Rejeitado</span>'; actions = ''; }
                return '<div class="item"><div class="item-header"><div><div class="item-title">' + (sub.taskTitle || 'Sem título') + '</div><div class="item-meta"><span class="user-badge">👤 ' + (sub.user || 'SEM ID') + '</span> • ' + new Date(sub.date).toLocaleString() + '</div></div>' + badge + '</div><div style="color:#e53e3e;font-weight:bold;margin-bottom:10px;">💰 R$ ' + (sub.reward || 0).toFixed(2) + ' (' + (sub.coins || 0) + ' moedas)</div>' + (sub.image ? '<img src="' + sub.image + '" onclick="window.open(\'' + sub.image + '\', \'_blank\')">' : '<div style="color:#e53e3e;">⚠️ Sem imagem</div>') + actions + '</div>';
            }).join('');
        }

        function renderWithdrawals() {
            const list = document.getElementById('withdrawalsList');
            let withdrawals = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            const filterId = document.getElementById('filterWithdrawUserId').value.toUpperCase();
            if (filterId) withdrawals = withdrawals.filter(w => w.user && w.user.includes(filterId));
            if (withdrawals.length === 0) { list.innerHTML = '<div class="empty">Nenhuma solicitação de saque</div>'; return; }
            withdrawals.sort((a, b) => new Date(b.date) - new Date(a.date));
            const pixTypeLabels = { cpf: 'CPF', cnpj: 'CNPJ', email: 'E-mail', phone: 'Celular', random: 'Chave Aleatória' };
            list.innerHTML = withdrawals.map(w => {
                let badge = '<span class="badge badge-pending">⏳ Pendente</span>', actions = '<div class="actions"><button class="btn-approve" onclick="approveWithdrawal(' + w.id + ')">✓ Marcar como Pago</button><button class="btn-reject" onclick="rejectWithdrawal(' + w.id + ')">✕ Recusar</button></div>';
                if (w.status === 'approved') { badge = '<span class="badge badge-approved">✓ Pago</span>'; actions = ''; }
                else if (w.status === 'rejected') { badge = '<span class="badge badge-rejected">✕ Recusado</span>'; actions = ''; }
                return '<div class="item"><div class="item-header"><div><div class="item-title">Saque de R$ ' + (w.amount || 0).toFixed(2) + '</div><div class="item-meta"><span class="user-badge">👤 ' + (w.user || 'SEM ID') + '</span> • ' + new Date(w.date).toLocaleString() + '</div></div>' + badge + '</div><div style="background:#f7fafc;padding:15px;border-radius:8px;margin-top:10px;"><div style="margin-bottom:8px;"><strong>Tipo:</strong> ' + (pixTypeLabels[w.pixType] || w.pixType) + '</div><div style="background:white;padding:10px;border-radius:6px;border:1px solid #e2e8f0;font-family:monospace;font-size:16px;word-break:break-all;">' + (w.pixKey || 'N/A') + '</div><div style="margin-top:8px;color:#718096;font-size:14px;"><strong>Moedas:</strong> ' + ((w.coins || 0).toLocaleString()) + '</div></div>' + actions + '</div>';
            }).join('');
        }

        function renderTasks() {
            const list = document.getElementById('tasksList');
            const tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            if (tasks.length === 0) { list.innerHTML = '<div class="empty">Nenhuma tarefa cadastrada</div>'; return; }
            list.innerHTML = '<h3 style="margin-bottom:15px;">Tarefas Ativas</h3>' + tasks.map(t => '<div class="item"><div class="item-header"><div><div class="item-title">' + (t.icon || '💳') + ' ' + (t.title || 'Sem título') + '</div><div class="item-meta">' + (t.desc || 'Sem descrição') + '</div></div></div><div style="color:#e53e3e;font-weight:bold;">💰 R$ ' + (t.reward || 0).toFixed(2) + ' • ' + (t.coins || 0) + ' moedas</div><div style="margin-top:10px;color:#718096;font-size:12px;word-break:break-all;">' + (t.link || 'Sem link') + '</div><div class="actions"><button class="btn-delete" onclick="deleteTask(' + t.id + ')">🗑️ Excluir</button></div></div>').join('');
        }

        function renderUsers() {
            const list = document.getElementById('usersList');
            const submissions = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            const withdrawals = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            const users = {};
            submissions.forEach(s => { const uid = s.user || 'SEM_ID'; if (!users[uid]) users[uid] = { submissions: [], withdrawals: [], coins: 0, lastActive: s.date }; users[uid].submissions.push(s); if (s.status === 'approved') users[uid].coins += (s.coins || 0); if (new Date(s.date) > new Date(users[uid].lastActive)) users[uid].lastActive = s.date; });
            withdrawals.forEach(w => { const uid = w.user || 'SEM_ID'; if (!users[uid]) users[uid] = { submissions: [], withdrawals: [], coins: 0, lastActive: w.date }; users[uid].withdrawals.push(w); if (new Date(w.date) > new Date(users[uid].lastActive)) users[uid].lastActive = w.date; });
            const searchId = document.getElementById('searchUserId').value.toUpperCase();
            let userList = Object.entries(users);
            if (searchId) userList = userList.filter(([id, data]) => id.includes(searchId));
            userList.sort((a, b) => new Date(b[1].lastActive) - new Date(a[1].lastActive));
            if (userList.length === 0) { list.innerHTML = '<div class="empty">Nenhum usuário encontrado</div>'; return; }
            list.innerHTML = userList.map(([id, data]) => {
                const approved = data.submissions.filter(s => s.status === 'approved').length;
                const pending = data.submissions.filter(s => s.status === 'pending').length;
                const rejected = data.submissions.filter(s => s.status === 'rejected').length;
                const totalWithdrawn = data.withdrawals.filter(w => w.status === 'approved').reduce((a, w) => a + (w.amount || 0), 0);
                const pendingWithdrawals = data.withdrawals.filter(w => w.status === 'pending').length;
                return '<div class="item"><div class="item-header"><div><span class="user-badge" style="font-size:14px;padding:6px 12px;">👤 ' + id + '</span></div><div style="color:#84cc16;font-weight:bold;font-size:18px;">' + data.coins.toLocaleString() + ' moedas</div></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0;text-align:center;"><div style="background:#f7fafc;padding:10px;border-radius:8px;"><div style="font-size:20px;font-weight:bold;">' + data.submissions.length + '</div><div style="font-size:12px;color:#718096;">Total</div></div><div style="background:#f0fff4;padding:10px;border-radius:8px;"><div style="font-size:20px;font-weight:bold;color:#48bb78;">' + approved + '</div><div style="font-size:12px;color:#718096;">Aprovadas</div></div><div style="background:#fffaf0;padding:10px;border-radius:8px;"><div style="font-size:20px;font-weight:bold;color:#ed8936;">' + pending + '</div><div style="font-size:12px;color:#718096;">Pendentes</div></div><div style="background:#fff5f5;padding:10px;border-radius:8px;"><div style="font-size:20px;font-weight:bold;color:#e53e3e;">' + rejected + '</div><div style="font-size:12px;color:#718096;">Rejeitadas</div></div></div><div style="display:flex;justify-content:space-between;align-items:center;background:#f7fafc;padding:10px;border-radius:8px;"><div><div style="color:#718096;font-size:12px;">💸 Total sacado</div><div style="font-weight:bold;color:#2d3748;">R$ ' + totalWithdrawn.toFixed(2) + '</div></div><div style="text-align:right;"><div style="color:#718096;font-size:12px;">⏳ Saques pendentes</div><div style="font-weight:bold;color:#ed8936;">' + pendingWithdrawals + '</div></div></div><div style="margin-top:10px;color:#a0aec0;font-size:12px;text-align:right;">Última atividade: ' + new Date(data.lastActive).toLocaleString() + '</div></div>';
            }).join('');
        }

        function approveSubmission(id) {
            const submissions = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            const sub = submissions.find(s => s.id === id);
            if (!sub) return;
            sub.status = 'approved'; sub.approvedAt = new Date().toISOString();
            localStorage.setItem(DB_PREFIX + 'submissions', JSON.stringify(submissions));
            const userCoins = parseInt(localStorage.getItem(DB_PREFIX + 'coins_' + sub.user)) || 0;
            localStorage.setItem(DB_PREFIX + 'coins_' + sub.user, userCoins + (sub.coins || 0));
            showToast('✓ Aprovado! ' + sub.coins + ' moedas para ' + sub.user);
            updateStats(); renderSubmissions();
        }

        function rejectSubmission(id) {
            const submissions = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            const sub = submissions.find(s => s.id === id);
            if (!sub) return;
            sub.status = 'rejected'; sub.rejectedAt = new Date().toISOString();
            localStorage.setItem(DB_PREFIX + 'submissions', JSON.stringify(submissions));
            showToast('✕ Comprovante rejeitado');
            updateStats(); renderSubmissions();
        }

        function approveWithdrawal(id) {
            const withdrawals = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            const w = withdrawals.find(x => x.id === id);
            if (!w) return;
            w.status = 'approved'; w.paidAt = new Date().toISOString();
            localStorage.setItem(DB_PREFIX + 'withdrawals', JSON.stringify(withdrawals));
            showToast('✓ Saque de R$ ' + (w.amount || 0).toFixed(2) + ' marcado como pago');
            updateStats(); renderWithdrawals();
        }

        function rejectWithdrawal(id) {
            const withdrawals = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            const w = withdrawals.find(x => x.id === id);
            if (!w) return;
            const userCoins = parseInt(localStorage.getItem(DB_PREFIX + 'coins_' + w.user)) || 0;
            localStorage.setItem(DB_PREFIX + 'coins_' + w.user, userCoins + (w.coins || 0));
            w.status = 'rejected'; w.rejectedAt = new Date().toISOString();
            localStorage.setItem(DB_PREFIX + 'withdrawals', JSON.stringify(withdrawals));
            showToast('✕ Saque recusado e moedas devolvidas');
            updateStats(); renderWithdrawals();
        }

                        function createTask() {
            const title = document.getElementById('newTaskTitle').value.trim();
            const desc = document.getElementById('newTaskDesc').value.trim();
            const link = document.getElementById('newTaskLink').value.trim();
            const reward = parseFloat(document.getElementById('newTaskReward').value);
            const taskCoins = parseInt(document.getElementById('newTaskCoins').value);
            
            // Pega o arquivo do input que você criou na linha 122
            const imgInput = document.querySelector('input[type="file"]');
            const file = imgInput ? imgInput.files[0] : null;

            if (!title || !desc || !link) { showToast('Preencha todos os campos!'); return; }

            // Função interna para salvar os dados
            const save = (imgData = "") => {
                const tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
                tasks.push({ 
                    id: Date.now(), 
                    title, 
                    desc, 
                    link, 
                    reward, 
                    coins: taskCoins, 
                    icon: '💳', 
                    iconColor: 'green',
                    tutorialImg: imgData // Salva a foto aqui
                });
                localStorage.setItem(DB_PREFIX + 'tasks', JSON.stringify(tasks));
                
                // Limpa os campos após salvar
                document.getElementById('newTaskTitle').value = ''; 
                document.getElementById('newTaskDesc').value = ''; 
                document.getElementById('newTaskLink').value = '';
                if(imgInput) imgInput.value = '';
                
                showToast('✓ Tarefa criada com sucesso!');
                renderTasks();
            };

            // Se tiver foto, converte para texto. Se não, salva direto.
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => save(e.target.result);
                reader.readAsDataURL(file);
            } else {
                save();
            }
        }

            
            // Pega o arquivo do input que você criou na linha 122
            const imgInput = document.querySelector('input[type="file"]');
            const file = imgInput ? imgInput.files[0] : null;

            if (!title || !desc || !link) { showToast('Preencha todos os campos!'); return; }

            // Função interna para salvar os dados
            const save = (imgData = "") => {
                const tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
                tasks.push({ 
                    id: Date.now(), 
                    title, 
                    desc, 
                    link, 
                    reward, 
                    coins: taskCoins, 
                    icon: '💳', 
                    iconColor: 'green',
                    tutorialImg: imgData // Salva a foto aqui
                });
                localStorage.setItem(DB_PREFIX + 'tasks', JSON.stringify(tasks));
                
                // Limpa os campos após salvar
                document.getElementById('newTaskTitle').value = ''; 
                document.getElementById('newTaskDesc').value = ''; 
                document.getElementById('newTaskLink').value = '';
                if(imgInput) imgInput.value = '';
                
                showToast('✓ Tarefa criada com sucesso!');
                renderTasks();
            };

            // Se tiver foto, converte para texto. Se não, salva direto.
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => save(e.target.result);
                reader.readAsDataURL(file);
            } else {
                save();
            }
            
         }
        

        function deleteTask(id) {
            if (!confirm('Tem certeza que deseja excluir esta tarefa?')) return;
            let tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem(DB_PREFIX + 'tasks', JSON.stringify(tasks));
            showToast('✓ Tarefa excluída');
            renderTasks();
        }

        function showToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
    </script>
