<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarefaPix - Painel Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f5f5; color: #333; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .login-box { background: white; border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 28px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .admin-container { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #667eea; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #718096; font-size: 14px; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #2d3748; }
        .section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section h2 { margin-bottom: 20px; color: #2d3748; display: flex; align-items: center; gap: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #667eea; color: white; }
        .item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .item-title { font-weight: bold; color: #2d3748; }
        .item-meta { color: #718096; font-size: 14px; }
        .item img { width: 100%; max-width: 300px; border-radius: 8px; margin: 10px 0; cursor: pointer; border: 1px solid #ddd; }
        .user-badge { background: #667eea; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; font-family: monospace; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #fffaf0; color: #c05621; }
        .badge-approved { background: #f0fff4; color: #22543d; }
        .badge-rejected { background: #fff5f5; color: #c53030; }
        .actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn-approve { padding: 10px 20px; background: #48bb78; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-reject { padding: 10px 20px; background: #e53e3e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-delete { padding: 10px 20px; background: #718096; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        .btn-save { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2d3748; color: white; padding: 16px 24px; border-radius: 12px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 300; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="logo"><h1>🔐 Painel Admin</h1></div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Senha de Administrador</label>
                    <input type="password" id="adminPass" placeholder="Digite a senha" required>
                </div>
                <button type="submit" class="btn-primary">ENTRAR</button>
            </form>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <div class="header">
            <h1>📊 TarefaPix Admin</h1>
            <button class="btn-delete" onclick="location.reload()">Sair</button>
        </div>

        <div class="stats">
            <div class="stat-card"><h3>👥 Usuários</h3><div class="value" id="statUsers">0</div></div>
            <div class="stat-card"><h3>📋 Pendentes</h3><div class="value" id="statPending">0</div></div>
            <div class="stat-card"><h3>✓ Aprovados</h3><div class="value" id="statApproved">0</div></div>
            <div class="stat-card"><h3>💸 Saques</h3><div class="value" id="statWithdrawals">0</div></div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showSection('submissions')">📋 Comprovantes</button>
            <button class="tab" onclick="showSection('withdrawals')">💸 Saques</button>
            <button class="tab" onclick="showSection('tasks')">📝 Tarefas</button>
        </div>

        <div class="section" id="section-submissions">
            <h2>📋 Comprovantes Enviados</h2>
            <div id="submissionsList"></div>
        </div>

        <div class="section" id="section-withdrawals" style="display:none;">
            <h2>💸 Solicitações de Saque</h2>
            <div id="withdrawalsList"></div>
        </div>

        <div class="section" id="section-tasks" style="display:none;">
            <h2>📝 Gerenciar Tarefas</h2>
            <div style="background:#f7fafc;padding:20px;border-radius:12px;margin-bottom:20px;">
                <h3 style="margin-bottom:15px;">➕ Nova Tarefa</h3>
                <div class="form-group"><label>Título</label><input type="text" id="newTaskTitle" placeholder="Ex: Siga no Instagram"></div>
                <div class="form-group"><label>Descrição</label><textarea id="newTaskDesc" placeholder="Descreva os passos..."></textarea></div>
                <div class="form-group"><label>Link</label><input type="url" id="newTaskLink" placeholder="https://..."></div>
                
                <div class="form-group">
                    <label>🖼️ Foto do Tutorial (Print de onde colocar código, etc)</label>
                    <input type="file" id="newTaskImg" accept="image/*" onchange="handleTutorialImg(this)">
                    <img id="tutorialPreview" style="max-width:100px; display:none; margin-top:10px; border-radius:8px;">
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
                    <div class="form-group"><label>Recompensa (R$)</label><input type="number" id="newTaskReward" step="0.01" value="1.00"></div>
                    <div class="form-group"><label>Moedas</label><input type="number" id="newTaskCoins" value="1000"></div>
                </div>
                <button class="btn-save" onclick="createTask()">Criar Tarefa</button>
            </div>
            <div id="tasksList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const DB_PREFIX = 'tarefapix_';
        let currentTutorialImg = "";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('adminPass').value === 'admin123') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadData();
            } else { showToast('❌ Senha incorreta!'); }
        });

        function handleTutorialImg(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                currentTutorialImg = reader.result;
                const prev = document.getElementById('tutorialPreview');
                prev.src = reader.result;
                prev.style.display = 'block';
            };
            if (file) reader.readAsDataURL(file);
        }

        function showSection(section) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            ['submissions', 'withdrawals', 'tasks'].forEach(s => document.getElementById('section-' + s).style.display = 'none');
            document.getElementById('section-' + section).style.display = 'block';
        }

        function loadData() {
            renderSubmissions();
            renderWithdrawals();
            renderTasks();
            updateStats();
        }

        function updateStats() {
            const subs = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            const ws = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            document.getElementById('statPending').textContent = subs.filter(s => s.status === 'pending').length;
            document.getElementById('statApproved').textContent = subs.filter(s => s.status === 'approved').length;
            document.getElementById('statWithdrawals').textContent = ws.filter(w => w.status === 'pending').length;
        }

        function renderSubmissions() {
            const list = document.getElementById('submissionsList');
            const subs = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            if (subs.length === 0) { list.innerHTML = '<div class="empty">Nenhum comprovante enviado</div>'; return; }
            list.innerHTML = subs.map(sub => `
                <div class="item">
                    <div class="item-header">
                        <div><strong>${sub.taskTitle}</strong> <br> <span class="user-badge">${sub.user}</span></div>
                        <span class="badge badge-${sub.status}">${sub.status}</span>
                    </div>
                    <img src="${sub.image}" onclick="window.open('${sub.image}')">
                    ${sub.status === 'pending' ? `
                        <div class="actions">
                            <button class="btn-approve" onclick="updateSubmission(${sub.id}, 'approved')">Aprovar</button>
                            <button class="btn-reject" onclick="updateSubmission(${sub.id}, 'rejected')">Rejeitar</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function updateSubmission(id, status) {
            const subs = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            const sub = subs.find(s => s.id === id);
            if (sub) {
                sub.status = status;
                if (status === 'approved') {
                    const currentCoins = parseInt(localStorage.getItem(DB_PREFIX + 'coins_' + sub.user)) || 0;
                    localStorage.setItem(DB_PREFIX + 'coins_' + sub.user, currentCoins + sub.coins);
                }
                localStorage.setItem(DB_PREFIX + 'submissions', JSON.stringify(subs));
                loadData();
                showToast(status === 'approved' ? '✓ Aprovado!' : '✗ Rejeitado');
            }
        }

        function renderWithdrawals() {
            const list = document.getElementById('withdrawalsList');
            const ws = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            list.innerHTML = ws.map(w => `
                <div class="item">
                    <div><strong>R$ ${w.amount.toFixed(2)}</strong> - ${w.pixKey} (${w.pixType})</div>
                    <div class="user-badge">${w.user}</div>
                    <span class="badge badge-${w.status}">${w.status}</span>
                    ${w.status === 'pending' ? `
                        <div class="actions">
                            <button class="btn-approve" onclick="updateWithdraw(${w.id}, 'paid')">Pago</button>
                            <button class="btn-reject" onclick="updateWithdraw(${w.id}, 'rejected')">Recusar</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function updateWithdraw(id, status) {
            const ws = JSON.parse(localStorage.getItem(DB_PREFIX + 'withdrawals') || '[]');
            const w = ws.find(x => x.id === id);
            if (w) {
                w.status = status;
                if (status === 'rejected') {
                    const current = parseInt(localStorage.getItem(DB_PREFIX + 'coins_' + w.user)) || 0;
                    localStorage.setItem(DB_PREFIX + 'coins_' + w.user, current + w.coins);
                }
                localStorage.setItem(DB_PREFIX + 'withdrawals', JSON.stringify(ws));
                loadData();
            }
        }

        function renderTasks() {
            const list = document.getElementById('tasksList');
            const tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            list.innerHTML = tasks.map(t => `
                <div class="item">
                    <div class="item-title">${t.title}</div>
                    <div class="item-meta">${t.desc}</div>
                    <div style="color:#e53e3e;font-weight:bold;">R$ ${t.reward.toFixed(2)} (${t.coins} moedas)</div>
                    ${t.tutorialImg ? `<img src="${t.tutorialImg}" style="width:80px; margin-top:10px;">` : ''}
                    <button class="btn-delete" style="margin-top:10px;" onclick="deleteTask(${t.id})">Excluir</button>
                </div>
            `).join('');
        }

        function createTask() {
            const title = document.getElementById('newTaskTitle').value.trim();
            const desc = document.getElementById('newTaskDesc').value.trim();
            const link = document.getElementById('newTaskLink').value.trim();
            const reward = parseFloat(document.getElementById('newTaskReward').value);
            const taskCoins = parseInt(document.getElementById('newTaskCoins').value);
            if (!title || !desc || !link) { showToast('Preencha tudo!'); return; }

            const tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            tasks.push({ 
                id: Date.now(), 
                title, 
                desc, 
                link, 
                reward, 
                coins: taskCoins, 
                icon: '💳', 
                iconColor: 'green',
                tutorialImg: currentTutorialImg 
            });
            localStorage.setItem(DB_PREFIX + 'tasks', JSON.stringify(tasks));

            document.getElementById('newTaskTitle').value = ''; 
            document.getElementById('newTaskDesc').value = ''; 
            document.getElementById('newTaskLink').value = '';
            document.getElementById('newTaskImg').value = '';
            document.getElementById('tutorialPreview').style.display = 'none';
            currentTutorialImg = "";

            showToast('✓ Tarefa criada!');
            renderTasks();
        }

        function deleteTask(id) {
            let tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem(DB_PREFIX + 'tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function showToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
    </script>
</body>
</html>
