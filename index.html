<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Sistema de Cupons</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; color: white; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .card h2 { color: #333; margin-bottom: 20px; font-size: 1.5em; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #667eea; outline: none; }
        
        .btn { padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color: white; }
        .btn-copy { background: #667eea; color: white; padding: 8px 15px; font-size: 14px; }
        
        .cupom-list { display: grid; gap: 15px; }
        .cupom-item { background: #f8f9fa; border-radius: 10px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #667eea; }
        .cupom-code { font-family: 'Courier New', monospace; font-size: 1.3em; font-weight: bold; color: #667eea; background: white; padding: 5px 15px; border-radius: 5px; border: 2px dashed #667eea; }
        .cupom-info { flex: 1; margin-left: 20px; }
        .cupom-info p { margin: 3px 0; color: #666; }
        .cupom-status { padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-ativo { background: #d4edda; color: #155724; }
        .status-usado { background: #f8d7da; color: #721c24; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stat-number { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 25px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 25px; cursor: pointer; transition: all 0.3s; }
        .tab.active { background: white; color: #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .hidden { display: none; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .usuarios-list { max-height: 400px; overflow-y: auto; }
        .usuario-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-acao { padding: 5px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .btn-editar { background: #ffc107; color: #000; }
        .btn-excluir { background: #dc3545; color: white; }
        
        @media (max-width: 768px) {
            .cupom-item { flex-direction: column; text-align: center; }
            .cupom-info { margin: 10px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Painel Administrativo</h1>
            <p>Gerencie cupons, usuários e saques</p>
        </div>

        <!-- Login -->
        <div id="loginSection" class="card">
            <h2>🔐 Login Admin</h2>
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="adminUser" value="admin">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="adminPass" value="admin123">
            </div>
            <button class="btn btn-primary" onclick="login()">Entrar</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboardSection" class="hidden">
            <div class="tabs">
                <button class="tab active" onclick="showTab('cupons')">🎫 Cupons</button>
                <button class="tab" onclick="showTab('usuarios')">👥 Usuários</button>
                <button class="tab" onclick="showTab('saques')">💰 Saques</button>
                <button class="tab" onclick="showTab('tarefas')">📋 Tarefas</button>
            </div>

            <!-- Aba Cupons -->
            <div id="tabCupons" class="tab-content active">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalCupons">0</div>
                        <div class="stat-label">Total de Cupons</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="cuponsAtivos">0</div>
                        <div class="stat-label">Cupons Ativos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="cuponsUsados">0</div>
                        <div class="stat-label">Cupons Usados</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="valorDistribuido">R$ 0</div>
                        <div class="stat-label">Valor Distribuído</div>
                    </div>
                </div>

                <div class="card">
                    <h2>🎫 Gerar Novo Cupom</h2>
                    <div id="alertCupom"></div>
                    <div class="form-group">
                        <label>Código do Cupom (ex: META300, SORTEIO20)</label>
                        <input type="text" id="codigoCupom" placeholder="Digite o código..." style="text-transform: uppercase;">
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="valorCupom" value="1.50" step="0.01" min="0.01">
                    </div>
                    <div class="form-group">
                        <label>Descrição/Observação</label>
                        <input type="text" id="descricaoCupom" placeholder="Ex: Sorteio para 300 membros do grupo">
                    </div>
                    <button class="btn btn-success" onclick="gerarCupom()">🎫 Gerar Cupom</button>
                </div>

                <div class="card">
                    <h2>📋 Cupons Gerados</h2>
                    <div id="listaCupons" class="cupom-list">
                        <p style="text-align: center; color: #999;">Nenhum cupom gerado ainda</p>
                    </div>
                </div>
            </div>

            <!-- Aba Usuários -->
            <div id="tabUsuarios" class="tab-content">
                <div class="card">
                    <h2>👥 Gerenciar Usuários</h2>
                    <div id="listaUsuarios" class="usuarios-list"></div>
                </div>
            </div>

            <!-- Aba Saques -->
            <div id="tabSaques" class="tab-content">
                <div class="card">
                    <h2>💰 Solicitações de Saque</h2>
                    <div id="listaSaques"></div>
                </div>
            </div>

            <!-- Aba Tarefas -->
            <div id="tabTarefas" class="tab-content">
                <div class="card">
                    <h2>📋 Gerenciar Tarefas</h2>
                    <div id="listaTarefasAdmin"></div>
                </div>
            </div>

            <button class="btn btn-danger" onclick="logout()" style="margin-top: 20px;">Sair</button>
        </div>
    </div>

    <script>
        // Configuração Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA1r_PfVzXqDLxI52znZpopBjvlz2W2WzQ",
            authDomain: "tarefa-pix.firebaseapp.com",
            databaseURL: "https://tarefa-pix-default-rtdb.firebaseio.com",
            projectId: "tarefa-pix",
            storageBucket: "tarefa-pix.firebasestorage.app",
            messagingSenderId: "16378804197",
            appId: "1:16378804197:web:0e95c0fd5440ec4e7e2106"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentAdmin = null;

        function login() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if (user === 'admin' && pass === 'admin123') {
                currentAdmin = user;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                carregarDados();
            } else {
                alert('Credenciais inválidas!');
            }
        }

        function logout() {
            currentAdmin = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            
            if (tab === 'cupons') carregarCupons();
            if (tab === 'usuarios') carregarUsuarios();
            if (tab === 'saques') carregarSaques();
            if (tab === 'tarefas') carregarTarefas();
        }

        function showAlert(id, message, type) {
            const alert = document.getElementById(id);
            alert.className = 'alert alert-' + type;
            alert.textContent = message;
            setTimeout(() => alert.textContent = '', 3000);
        }

        // ===== SISTEMA DE CUPONS =====
        function gerarCupom() {
            const codigo = document.getElementById('codigoCupom').value.toUpperCase().trim();
            const valor = parseFloat(document.getElementById('valorCupom').value);
            const descricao = document.getElementById('descricaoCupom').value.trim();

            if (!codigo) {
                showAlert('alertCupom', 'Digite um código para o cupom!', 'error');
                return;
            }

            if (!valor || valor <= 0) {
                showAlert('alertCupom', 'Valor inválido!', 'error');
                return;
            }

            const cupom = {
                codigo: codigo,
                valor: valor,
                descricao: descricao,
                status: 'ativo',
                usadoPor: null,
                dataCriacao: Date.now(),
                dataUso: null
            };

            db.ref('cupons/' + codigo).set(cupom)
                .then(() => {
                    showAlert('alertCupom', 'Cupom "' + codigo + '" gerado com sucesso!', 'success');
                    document.getElementById('codigoCupom').value = '';
                    document.getElementById('descricaoCupom').value = '';
                    carregarCupons();
                })
                .catch(error => {
                    showAlert('alertCupom', 'Erro ao gerar cupom: ' + error.message, 'error');
                });
        }

        function carregarCupons() {
            db.ref('cupons').once('value', snapshot => {
                const cupons = snapshot.val() || {};
                const lista = document.getElementById('listaCupons');
                
                let total = 0, ativos = 0, usados = 0, valorTotal = 0;
                let html = '';

                Object.values(cupons).forEach(cupom => {
                    total++;
                    if (cupom.status === 'ativo') ativos++;
                    if (cupom.status === 'usado') {
                        usados++;
                        valorTotal += cupom.valor;
                    }

                    html += `
                        <div class="cupom-item">
                            <div class="cupom-code">${cupom.codigo}</div>
                            <div class="cupom-info">
                                <p><strong>Valor:</strong> R$ ${cupom.valor.toFixed(2)}</p>
                                <p><strong>Descrição:</strong> ${cupom.descricao || 'Sem descrição'}</p>
                                <p><strong>Criado:</strong> ${new Date(cupom.dataCriacao).toLocaleString()}</p>
                                ${cupom.usadoPor ? `<p><strong>Usado por:</strong> ${cupom.usadoPor}</p>` : ''}
                            </div>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <span class="cupom-status ${cupom.status === 'ativo' ? 'status-ativo' : 'status-usado'}">
                                    ${cupom.status === 'ativo' ? '🟢 ATIVO' : '🔴 USADO'}
                                </span>
                                ${cupom.status === 'ativo' ? `
                                    <button class="btn btn-copy" onclick="copiarCupom('${cupom.codigo}')">Copiar</button>
                                    <button class="btn btn-danger" onclick="excluirCupom('${cupom.codigo}')">Excluir</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                document.getElementById('totalCupons').textContent = total;
                document.getElementById('cuponsAtivos').textContent = ativos;
                document.getElementById('cuponsUsados').textContent = usados;
                document.getElementById('valorDistribuido').textContent = 'R$ ' + valorTotal.toFixed(2);

                lista.innerHTML = html || '<p style="text-align: center; color: #999;">Nenhum cupom gerado ainda</p>';
            });
        }

        function copiarCupom(codigo) {
            navigator.clipboard.writeText(codigo).then(() => {
                alert('Cupom "' + codigo + '" copiado! Cole no grupo do WhatsApp/Telegram.');
            });
        }

        function excluirCupom(codigo) {
            if (confirm('Tem certeza que deseja excluir o cupom "' + codigo + '"?')) {
                db.ref('cupons/' + codigo).remove()
                    .then(() => {
                        carregarCupons();
                    });
            }
        }

        // ===== USUÁRIOS =====
        function carregarUsuarios() {
            db.ref('usuarios').once('value', snapshot => {
                const usuarios = snapshot.val() || {};
                let html = '';
                
                Object.entries(usuarios).forEach(([id, user]) => {
                    html += `
                        <div class="usuario-item">
                            <div>
                                <strong>${user.nome || id}</strong><br>
                                <small>ID: ${id} | Saldo: R$ ${(user.saldo || 0).toFixed(2)}</small>
                            </div>
                            <div>
                                <button class="btn-acao btn-editar" onclick="editarSaldo('${id}', ${user.saldo || 0})">Editar Saldo</button>
                                <button class="btn-acao btn-excluir" onclick="excluirUsuario('${id}')">Excluir</button>
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById('listaUsuarios').innerHTML = html || '<p style="text-align: center;">Nenhum usuário cadastrado</p>';
            });
        }

        function editarSaldo(userId, saldoAtual) {
            const novoSaldo = prompt('Novo saldo para ' + userId + ':', saldoAtual);
            if (novoSaldo !== null) {
                db.ref('usuarios/' + userId + '/saldo').set(parseFloat(novoSaldo))
                    .then(() => carregarUsuarios());
            }
        }

        function excluirUsuario(userId) {
            if (confirm('Excluir usuário ' + userId + '?')) {
                db.ref('usuarios/' + userId).remove()
                    .then(() => carregarUsuarios());
            }
        }

        // ===== SAQUES =====
        function carregarSaques() {
            db.ref('saques').once('value', snapshot => {
                const saques = snapshot.val() || {};
                let html = '';
                
                Object.entries(saques).forEach(([id, saque]) => {
                    html += `
                        <div class="usuario-item">
                            <div>
                                <strong>${saque.usuario}</strong><br>
                                <small>R$ ${saque.valor.toFixed(2)} - ${saque.status}</small><br>
                                <small>Chave Pix: ${saque.chavePix || 'Não informada'}</small>
                            </div>
                            <div>
                                ${saque.status === 'pendente' ? `
                                    <button class="btn-acao btn-success" onclick="aprovarSaque('${id}')">Aprovar</button>
                                    <button class="btn-acao btn-danger" onclick="rejeitarSaque('${id}')">Rejeitar</button>
                                ` : '<span>' + saque.status + '</span>'}
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById('listaSaques').innerHTML = html || '<p style="text-align: center;">Nenhum saque solicitado</p>';
            });
        }

        function aprovarSaque(id) {
            db.ref('saques/' + id + '/status').set('aprovado')
                .then(() => carregarSaques());
        }

        function rejeitarSaque(id) {
            db.ref('saques/' + id + '/status').set('rejeitado')
                .then(() => carregarSaques());
        }

        // ===== TAREFAS =====
        function carregarTarefas() {
            db.ref('tarefas').once('value', snapshot => {
                const tarefas = snapshot.val() || {};
                let html = '';
                
                Object.entries(tarefas).forEach(([id, tarefa]) => {
                    html += `
                        <div class="usuario-item">
                            <div>
                                <strong>${tarefa.titulo}</strong><br>
                                <small>R$ ${tarefa.recompensa.toFixed(2)} - ${tarefa.status}</small>
                            </div>
                            <div>
                                <button class="btn-acao btn-excluir" onclick="excluirTarefa('${id}')">Excluir</button>
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById('listaTarefasAdmin').innerHTML = html || '<p style="text-align: center;">Nenhuma tarefa cadastrada</p>';
            });
        }

        function excluirTarefa(id) {
            if (confirm('Excluir esta tarefa?')) {
                db.ref('tarefas/' + id).remove()
                    .then(() => carregarTarefas());
            }
        }

        function carregarDados() {
            carregarCupons();
        }

        // Verificar login ao carregar
        window.onload = function() {
            // Já mostra login
        };
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</body>
</html>
