<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Tarefas</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .header h1 { color: #333; margin-bottom: 10px; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .tab.active { background: #667eea; color: white; }
        .tab:hover { transform: translateY(-2px); }
        .content {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea { min-height: 100px; resize: vertical; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 16px;
        }
        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .btn-danger { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); }
        .btn-warning { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .task-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }
        .task-card:hover { transform: translateX(5px); box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .task-card.pending { border-left-color: #ffc107; }
        .task-card.approved { border-left-color: #28a745; }
        .task-card.rejected { border-left-color: #dc3545; }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .task-title { font-size: 18px; font-weight: 700; color: #333; }
        .task-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .task-info { color: #666; margin-bottom: 15px; }
        .task-info p { margin: 5px 0; }
        .task-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .task-actions .btn { padding: 10px 20px; font-size: 14px; }
        .proof-image {
            max-width: 300px;
            max-height: 400px;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .proof-image:hover { transform: scale(1.05); }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number { font-size: 32px; font-weight: 700; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        .hidden { display: none !important; }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-container h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-proof { background: #e3f2fd; color: #1976d2; }
        .badge-no-proof { background: #f3e5f5; color: #7b1fa2; }
        .user-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .user-info p { margin: 5px 0; font-size: 14px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        .debug-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginSection" class="login-container">
        <h2>🔐 Painel Administrativo</h2>
        <div class="form-group">
            <label>Usuário</label>
            <input type="text" id="adminUser" placeholder="admin">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="adminPass" placeholder="admin123">
        </div>
        <button class="btn" onclick="login()" style="width: 100%;">Entrar</button>
        <div id="loginError" style="color: #dc3545; margin-top: 15px; text-align: center; display: none;">
            Usuário ou senha incorretos!
        </div>
    </div>

    <!-- Painel Admin -->
    <div id="adminPanel" class="container hidden">
        <div class="header">
            <h1>👨‍💼 Painel de Administração</h1>
            <div class="tabs">
                <button class="tab active" onclick="showTab('create')">➕ Criar Tarefa</button>
                <button class="tab" onclick="showTab('pending')">⏳ Aprovações Pendentes</button>
                <button class="tab" onclick="showTab('tasks')">📋 Todas as Tarefas</button>
                <button class="tab" onclick="showTab('stats')">📊 Estatísticas</button>
                <button class="tab" onclick="logout()">🚪 Sair</button>
            </div>
        </div>

        <!-- Criar Tarefa -->
        <div id="tab-create" class="content">
            <h2 class="section-title">➕ Nova Tarefa</h2>
            <form id="taskForm" onsubmit="createTask(event)">
                <div class="form-group">
                    <label>Título da Tarefa</label>
                    <input type="text" id="taskTitle" required placeholder="Ex: Recarregue R$ 5 e receba R$ 6">
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="taskDesc" required placeholder="Descreva os passos da tarefa..."></textarea>
                </div>
                <div class="form-group">
                    <label>Link da Plataforma (opcional)</label>
                    <input type="url" id="taskLink" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Recompensa (moedas)</label>
                    <input type="number" id="taskReward" required min="1" value="60" placeholder="60">
                </div>
                <div class="form-group">
                    <label>Imagem da Tarefa (opcional)</label>
                    <input type="file" id="taskImage" accept="image/*" onchange="previewImage(this, 'previewTaskImage')">
                    <img id="previewTaskImage" style="max-width: 200px; margin-top: 10px; display: none; border-radius: 10px;">
                </div>
                
                <!-- Checkbox para exigir comprovante -->
                <div class="checkbox-group">
                    <input type="checkbox" id="requireProof" checked>
                    <label for="requireProof">📸 Exigir comprovante (print) para completar esta tarefa</label>
                </div>
                
                <button type="submit" class="btn">Criar Tarefa</button>
            </form>
            <div id="createMessage" style="margin-top: 15px; padding: 15px; border-radius: 10px; display: none;"></div>
        </div>

        <!-- Aprovações Pendentes -->
        <div id="tab-pending" class="content hidden">
            <h2 class="section-title">⏳ Aprovações Pendentes</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterPending('all')">Todas</button>
                <button class="filter-btn" onclick="filterPending('with-proof')">Com Comprovante</button>
                <button class="filter-btn" onclick="filterPending('without-proof')">Sem Comprovante</button>
            </div>
            <div id="pendingList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    <p>Carregando...</p>
                </div>
            </div>
        </div>

        <!-- Todas as Tarefas -->
        <div id="tab-tasks" class="content hidden">
            <h2 class="section-title">📋 Gerenciar Tarefas</h2>
            <div id="tasksList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <p>Carregando tarefas...</p>
                </div>
            </div>
        </div>

        <!-- Estatísticas -->
        <div id="tab-stats" class="content hidden">
            <h2 class="section-title">📊 Estatísticas</h2>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="statTotalTasks">0</div>
                    <div class="stat-label">Total de Tarefas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statPending">0</div>
                    <div class="stat-label">Pendentes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statApproved">0</div>
                    <div class="stat-label">Aprovadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statRejected">0</div>
                    <div class="stat-label">Rejeitadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statTotalUsers">0</div>
                    <div class="stat-label">Usuários</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statTotalCoins">0</div>
                    <div class="stat-label">Moedas Distribuídas</div>
                </div>
            </div>
            <div id="debugInfo" class="debug-info" style="display: none;"></div>
        </div>
    </div>

    <!-- Modal para imagem -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="Comprovante">
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyChd5rTWWcK2f4eihD9bMOt43XqMh-3Y3c",
            authDomain: "tarefa-pix.firebaseapp.com",
            databaseURL: "https://tarefa-pix-default-rtdb.firebaseio.com",
            projectId: "tarefa-pix",
            storageBucket: "tarefa-pix.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variáveis globais
        let currentTab = 'create';
        let pendingFilter = 'all';

        // Login
        function login() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if (user === 'admin' && pass === 'admin123') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadStats();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
        }

        // Navegação
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.querySelectorAll('.content').forEach(c => c.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            
            if (tab === 'pending') loadPending();
            if (tab === 'tasks') loadTasks();
            if (tab === 'stats') loadStats();
        }

        // Preview de imagem
        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Criar tarefa
        async function createTask(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('.btn');
            btn.disabled = true;
            btn.textContent = 'Criando...';
            
            const title = document.getElementById('taskTitle').value;
            const desc = document.getElementById('taskDesc').value;
            const link = document.getElementById('taskLink').value;
            const reward = parseInt(document.getElementById('taskReward').value);
            const requireProof = document.getElementById('requireProof').checked;
            const imageFile = document.getElementById('taskImage').files[0];
            
            try {
                let imageBase64 = null;
                if (imageFile) {
                    imageBase64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(imageFile);
                    });
                }
                
                const taskData = {
                    id: Date.now().toString(),
                    title,
                    description: desc,
                    link: link || null,
                    reward,
                    requireProof: requireProof,
                    image: imageBase64,
                    createdAt: Date.now(),
                    active: true
                };
                
                console.log('Criando tarefa:', taskData);
                
                await db.ref('tasks/' + taskData.id).set(taskData);
                
                showMessage('createMessage', '✅ Tarefa criada com sucesso!', 'success');
                document.getElementById('taskForm').reset();
                document.getElementById('previewTaskImage').style.display = 'none';
                
            } catch (error) {
                console.error('Erro ao criar tarefa:', error);
                showMessage('createMessage', '❌ Erro: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Criar Tarefa';
            }
        }

        function showMessage(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.display = 'block';
            el.style.background = type === 'success' ? '#d4edda' : '#f8d7da';
            el.style.color = type === 'success' ? '#155724' : '#721c24';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        // Carregar pendentes
        function loadPending() {
            const list = document.getElementById('pendingList');
            list.innerHTML = '<div class="empty-state"><p>Carregando...</p></div>';
            
            db.ref('user_tasks').once('value', (snapshot) => {
                const userTasks = snapshot.val() || {};
                const pending = [];
                
                Object.entries(userTasks).forEach(([userId, tasks]) => {
                    Object.entries(tasks).forEach(([taskId, taskData]) => {
                        if (taskData.status === 'pending') {
                            pending.push({
                                userId,
                                taskId,
                                ...taskData
                            });
                        }
                    });
                });
                
                // Filtrar
                let filtered = pending;
                if (pendingFilter === 'with-proof') {
                    filtered = pending.filter(p => p.proofImage);
                } else if (pendingFilter === 'without-proof') {
                    filtered = pending.filter(p => !p.proofImage);
                }
                
                if (filtered.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <p>Nenhuma aprovação pendente!</p>
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = filtered.map(p => `
                    <div class="task-card pending">
                        <div class="task-header">
                            <span class="task-title">${p.taskTitle || 'Tarefa'}</span>
                            <span class="task-status status-pending">⏳ Pendente</span>
                        </div>
                        <div class="user-info">
                            <p><strong>👤 Usuário:</strong> ${p.userId}</p>
                            <p><strong>📅 Enviado em:</strong> ${new Date(p.completedAt || p.submittedAt).toLocaleString()}</p>
                            ${p.requireProof === false ? '<span class="badge badge-no-proof">📸 Sem comprovante exigido</span>' : ''}
                            ${p.proofImage ? '<span class="badge badge-proof">📸 Com comprovante</span>' : ''}
                        </div>
                        ${p.proofImage ? `
                            <img src="${p.proofImage}" class="proof-image" onclick="openModal('${p.proofImage}')" alt="Comprovante">
                        ` : '<p style="color: #666; font-style: italic;">Nenhuma imagem enviada</p>'}
                        <div class="task-actions">
                            <button class="btn btn-success" onclick="approveTask('${p.userId}', '${p.taskId}', ${p.reward || 0})">✅ Aprovar</button>
                            <button class="btn btn-danger" onclick="rejectTask('${p.userId}', '${p.taskId}')">❌ Rejeitar</button>
                        </div>
                    </div>
                `).join('');
            });
        }

        function filterPending(type) {
            pendingFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadPending();
        }

        // Aprovar tarefa
        async function approveTask(userId, taskId, reward) {
            if (!confirm('Tem certeza que deseja APROVAR esta tarefa?')) return;
            
            try {
                // Atualizar status
                await db.ref(`user_tasks/${userId}/${taskId}`).update({
                    status: 'approved',
                    approvedAt: Date.now()
                });
                
                // Adicionar moedas ao usuário
                if (reward > 0) {
                    const userRef = db.ref(`users/${userId}`);
                    const snapshot = await userRef.once('value');
                    const userData = snapshot.val() || {};
                    const currentCoins = userData.coins || 0;
                    
                    await userRef.update({
                        coins: currentCoins + reward
                    });
                }
                
                alert('✅ Tarefa aprovada com sucesso!');
                loadPending();
                loadStats();
            } catch (error) {
                alert('❌ Erro ao aprovar: ' + error.message);
            }
        }

        // Rejeitar tarefa
        async function rejectTask(userId, taskId) {
            if (!confirm('Tem certeza que deseja REJEITAR esta tarefa?')) return;
            
            try {
                await db.ref(`user_tasks/${userId}/${taskId}`).update({
                    status: 'rejected',
                    rejectedAt: Date.now()
                });
                
                alert('❌ Tarefa rejeitada!');
                loadPending();
                loadStats();
            } catch (error) {
                alert('❌ Erro ao rejeitar: ' + error.message);
            }
        }

        // Carregar todas as tarefas
        function loadTasks() {
            const list = document.getElementById('tasksList');
            
            db.ref('tasks').once('value', (snapshot) => {
                const tasks = snapshot.val() || {};
                
                if (Object.keys(tasks).length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            <p>Nenhuma tarefa criada ainda.</p>
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = Object.entries(tasks).map(([id, task]) => `
                    <div class="task-card ${task.active ? '' : 'rejected'}">
                        <div class="task-header">
                            <span class="task-title">${task.title}</span>
                            <div>
                                ${task.requireProof ? '<span class="badge badge-proof">📸 Exige comprovante</span>' : '<span class="badge badge-no-proof">✅ Não exige comprovante</span>'}
                                <span class="task-status ${task.active ? 'status-approved' : 'status-rejected'}">
                                    ${task.active ? '✅ Ativa' : '❌ Desativada'}
                                </span>
                            </div>
                        </div>
                        <div class="task-info">
                            <p>${task.description}</p>
                            <p><strong>💰 Recompensa:</strong> ${task.reward} moedas</p>
                            ${task.link ? `<p><strong>🔗 Link:</strong> <a href="${task.link}" target="_blank">${task.link}</a></p>` : ''}
                        </div>
                        ${task.image ? `<img src="${task.image}" style="max-width: 200px; border-radius: 10px; margin-top: 10px;">` : ''}
                        <div class="task-actions">
                            <button class="btn ${task.active ? 'btn-danger' : 'btn-success'}" onclick="toggleTask('${id}', ${!task.active})">
                                ${task.active ? '❌ Desativar' : '✅ Ativar'}
                            </button>
                            <button class="btn btn-warning" onclick="deleteTask('${id}')">🗑️ Excluir</button>
                        </div>
                    </div>
                `).join('');
            });
        }

        // Toggle tarefa
        async function toggleTask(taskId, active) {
            try {
                await db.ref(`tasks/${taskId}`).update({ active });
                loadTasks();
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }

        // Deletar tarefa
        async function deleteTask(taskId) {
            if (!confirm('Tem certeza que deseja EXCLUIR esta tarefa permanentemente?')) return;
            
            try {
                await db.ref(`tasks/${taskId}`).remove();
                loadTasks();
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }

        // Estatísticas
        function loadStats() {
            // Total de tarefas
            db.ref('tasks').once('value', (snapshot) => {
                const tasks = snapshot.val() || {};
                document.getElementById('statTotalTasks').textContent = Object.keys(tasks).length;
            });
            
            // User tasks
            db.ref('user_tasks').once('value', (snapshot) => {
                const userTasks = snapshot.val() || {};
                let pending = 0, approved = 0, rejected = 0;
                
                Object.values(userTasks).forEach(userTaskList => {
                    Object.values(userTaskList).forEach(task => {
                        if (task.status === 'pending') pending++;
                        else if (task.status === 'approved') approved++;
                        else if (task.status === 'rejected') rejected++;
                    });
                });
                
                document.getElementById('statPending').textContent = pending;
                document.getElementById('statApproved').textContent = approved;
                document.getElementById('statRejected').textContent = rejected;
            });
            
            // Usuários e moedas
            db.ref('users').once('value', (snapshot) => {
                const users = snapshot.val() || {};
                document.getElementById('statTotalUsers').textContent = Object.keys(users).length;
                
                let totalCoins = 0;
                Object.values(users).forEach(user => {
                    totalCoins += user.coins || 0;
                });
                document.getElementById('statTotalCoins').textContent = totalCoins;
            });
        }

        // Modal
        function openModal(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        // Enter para login
        document.getElementById('adminPass')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
