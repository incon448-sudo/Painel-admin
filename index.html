<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarefaPix - Painel Admin</title>
    <style>
        /* CSS COMPLETO ORIGINAL */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f5f5; color: #333; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .login-box { background: white; border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 28px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: all 0.3s; }
        .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .admin-container { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #718096; font-size: 14px; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #2d3748; }
        .section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; transition: all 0.3s; }
        .tab.active { background: #667eea; color: white; }
        .item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #fffaf0; color: #c05621; }
        .photo-upload-area { border: 2px dashed #cbd5e0; border-radius: 12px; padding: 20px; text-align: center; background: #f7fafc; cursor: pointer; margin-bottom: 10px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2d3748; color: white; padding: 16px 24px; border-radius: 12px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 2000; }
        .toast.show { opacity: 1; }
        /* ... restante do CSS original ... */
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="logo"><h1>🔐 Admin</h1></div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Senha de Administrador</label>
                    <input type="password" id="adminPass" placeholder="Digite 085213" required>
                </div>
                <button type="submit" class="btn-primary">ENTRAR</button>
            </form>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <div class="header">
            <h1>TarefaPix Admin</h1>
            <button onclick="location.reload()" style="background:none; border:none; color:#667eea; font-weight:bold; cursor:pointer;">Sair</button>
        </div>

        <div class="stats">
            <div class="stat-card"><h3>👥 Usuários</h3><div class="value" id="statUsers">0</div></div>
            <div class="stat-card"><h3>📋 Pendentes</h3><div class="value" id="statPending">0</div></div>
            <div class="stat-card"><h3>💸 Saques</h3><div class="value" id="statWithdrawals">0</div></div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showSection('submissions', event)">📋 Comprovantes</button>
            <button class="tab" onclick="showSection('withdrawals', event)">💸 Saques</button>
            <button class="tab" onclick="showSection('tasks', event)">📝 Tarefas</button>
            <button class="tab" onclick="showSection('users', event)">👥 Usuários</button>
        </div>

        <div id="section-submissions" class="section">
            <h2>Comprovantes</h2>
            <div id="submissionsList"></div>
        </div>

        <div id="section-tasks" class="section" style="display:none;">
            <h2>Gerenciar Tarefas</h2>
            <input type="text" id="newTaskTitle" placeholder="Título" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <textarea id="newTaskDesc" placeholder="Descrição" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
            <input type="text" id="newTaskLink" placeholder="Link (http://...)" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="number" id="newTaskReward" placeholder="Valor R$" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ddd;">
                <input type="number" id="newTaskCoins" placeholder="Moedas" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ddd;">
            </div>
            <button class="btn-primary" onclick="createTask()">PUBLICAR NO APP</button>
            <div id="tasksList" style="margin-top:20px;"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const DB_PREFIX = 'tarefapix_';
        const ADMIN_PASSWORD = '085213';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadData();
            } else { showToast('❌ Senha incorreta!'); }
        });

        function showSection(section, e) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            ['submissions', 'withdrawals', 'tasks', 'users'].forEach(s => {
                const el = document.getElementById('section-' + s);
                if(el) el.style.display = 'none';
            });
            document.getElementById('section-' + section).style.display = 'block';
            loadData();
        }

        function loadData() {
            const tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            const sub = JSON.parse(localStorage.getItem(DB_PREFIX + 'submissions') || '[]');
            document.getElementById('statPending').textContent = sub.filter(s => s.status === 'pending').length;
            renderTasks(tasks);
        }

        function createTask() {
            const title = document.getElementById('newTaskTitle').value;
            const desc = document.getElementById('newTaskDesc').value;
            const link = document.getElementById('newTaskLink').value;
            const reward = parseFloat(document.getElementById('newTaskReward').value) || 0;
            const coins = parseInt(document.getElementById('newTaskCoins').value) || 0;

            if(!title || !link) return showToast('❌ Preencha título e link!');

            const tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            tasks.push({ id: Date.now(), title, desc, link, reward, coins, icon: '📱', iconColor: 'blue', instructionPhotos: [] });
            localStorage.setItem(DB_PREFIX + 'tasks', JSON.stringify(tasks));
            showToast('✅ Tarefa enviada para o App!');
            loadData();
        }

        function renderTasks(tasks) {
            const list = document.getElementById('tasksList');
            list.innerHTML = tasks.map(t => `
                <div class="item" style="display:flex; justify-content:space-between; align-items:center;">
                    <div><strong>${t.title}</strong><br><small>R$ ${t.reward}</small></div>
                    <button onclick="deleteTask(${t.id})" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px;">Excluir</button>
                </div>
            `).join('') || 'Sem tarefas.';
        }

        function deleteTask(id) {
            let tasks = JSON.parse(localStorage.getItem(DB_PREFIX + 'tasks') || '[]');
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem(DB_PREFIX + 'tasks', JSON.stringify(tasks));
            loadData();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
